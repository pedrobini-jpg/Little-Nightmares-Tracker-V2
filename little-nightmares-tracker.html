<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Nightmares I & II — Rastreador de Conquistas</title>
<style>
  :root{
    --bg:#0b0b10;
    --panel:#15151d;
    --panel2:#1c1c26;
    --border:#2b2b38;
    --text:#e9e6df;
    --muted:#9a97a8;
    --accent:#c9a24b;
    --accent2:#7b5fd1;
    --good:#5cb87a;
    --bad:#c9503f;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(ellipse at top, #1a1a24 0%, #0b0b10 60%);
    color:var(--text);
    padding-bottom:60px;
  }
  header{
    padding:28px 20px 18px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(201,162,75,0.08), transparent);
  }
  header h1{
    margin:0 0 6px;
    font-size:1.6rem;
    letter-spacing:1px;
    color:var(--accent);
    text-shadow:0 0 12px rgba(201,162,75,0.35);
  }
  header p{margin:0;color:var(--muted);font-size:0.9rem}

  .overview{
    max-width:900px;
    margin:20px auto;
    padding:0 16px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
  }
  .card h3{margin:0 0 8px;font-size:0.95rem;color:var(--text);display:flex;justify-content:space-between}
  .card h3 span.pct{color:var(--accent);font-weight:700}
  .bar{height:9px;border-radius:6px;background:#000;overflow:hidden;border:1px solid var(--border)}
  .bar > div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
  .card small{color:var(--muted);display:block;margin-top:6px}

  .tabs{
    max-width:900px;margin:24px auto 0;padding:0 16px;
    display:flex;gap:8px;flex-wrap:wrap;
  }
  .tab-btn{
    background:var(--panel2);border:1px solid var(--border);color:var(--muted);
    padding:9px 16px;border-radius:999px;cursor:pointer;font-size:0.85rem;transition:.2s;
  }
  .tab-btn.active{background:var(--accent);color:#1a1500;border-color:var(--accent);font-weight:600}

  main{max-width:900px;margin:16px auto;padding:0 16px}
  .game-block{display:none}
  .game-block.active{display:block}

  .section{margin-bottom:26px}
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;padding-bottom:6px;border-bottom:1px dashed var(--border);
  }
  .section-head h2{font-size:1.05rem;margin:0;color:var(--accent2)}
  .section-head .count{font-size:0.8rem;color:var(--muted)}

  .ach{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
    transition:.2s;
  }
  .ach.done{border-color:rgba(92,184,122,0.5);background:linear-gradient(90deg, rgba(92,184,122,0.08), var(--panel) 30%)}
  .ach-top{display:flex;align-items:flex-start;gap:12px}
  .chk{
    flex:0 0 auto;width:24px;height:24px;border-radius:6px;border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;cursor:pointer;background:#000;margin-top:2px;
    font-size:14px;color:transparent;user-select:none;
  }
  .ach.done .chk{background:var(--good);border-color:var(--good);color:#062b0f}
  .ach-body{flex:1;min-width:0}
  .ach-name{font-weight:600;font-size:0.98rem}
  .ach-name .gs{color:var(--accent);font-weight:400;font-size:0.8rem;margin-left:6px}
  .ach-desc{color:var(--muted);font-size:0.85rem;font-style:italic;margin-top:2px}
  .ach-actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .tip-btn{
    background:none;border:1px solid var(--accent2);color:var(--accent2);
    font-size:0.75rem;padding:4px 10px;border-radius:999px;cursor:pointer;
  }
  .tip-btn:hover{background:var(--accent2);color:#fff}
  .del-btn{
    background:none;border:1px solid var(--bad);color:var(--bad);
    font-size:0.75rem;padding:4px 10px;border-radius:999px;cursor:pointer;
  }
  .tip-box{
    display:none;margin-top:8px;padding:10px 12px;background:#0e0e14;border-left:3px solid var(--accent2);
    border-radius:6px;font-size:0.85rem;color:#c9c6d8;line-height:1.4;
  }
  .tip-box.show{display:block}

  .add-form{
    margin-top:10px;background:var(--panel2);border:1px dashed var(--border);border-radius:10px;padding:12px;
  }
  .add-form input, .add-form textarea{
    width:100%;background:#0e0e14;border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:8px;margin-bottom:8px;font-family:inherit;font-size:0.85rem;
  }
  .add-form button{
    background:var(--accent);border:none;color:#1a1500;padding:8px 16px;border-radius:6px;
    cursor:pointer;font-weight:600;font-size:0.85rem;
  }
  .add-toggle{
    background:none;border:1px solid var(--muted);color:var(--muted);padding:6px 12px;
    border-radius:999px;cursor:pointer;font-size:0.8rem;margin-top:6px;
  }
  footer{text-align:center;color:var(--muted);font-size:0.75rem;margin-top:40px;padding:0 16px}
  .reset-btn{
    background:none;border:1px solid var(--bad);color:var(--bad);padding:6px 14px;border-radius:999px;
    font-size:0.75rem;cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>🌑 LITTLE NIGHTMARES — RASTREADOR DE CONQUISTAS</h1>
  <p>Little Nightmares I & II · Xbox · progresso salvo automaticamente neste navegador</p>
</header>

<div class="overview" id="overview"></div>

<div class="tabs" id="tabs">
  <button class="tab-btn active" data-game="ln1">Little Nightmares I</button>
  <button class="tab-btn" data-game="ln2">Little Nightmares II</button>

<main id="main"></main>

<footer>
  <p>Dica: clique no quadrado para marcar/desmarcar. As descrições são as oficiais das conquistas; a "Dica" mostra como conseguir (pode conter spoilers).</p>
  <button class="reset-btn" onclick="resetAll()">Zerar todo o progresso</button>

// ===================== ESTADO / LOCALSTORAGE =====================
const STORAGE_KEY = "ln_tracker_state_v1";
const CUSTOM_KEY = "ln_tracker_custom_v1";

function loadState(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveState(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function loadCustom(){
  try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || {ln1:[], ln2:[]}; }
  catch(e){ return {ln1:[], ln2:[]}; }
}
function saveCustom(custom){
  localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom));
}

let state = loadState();
let custom = loadCustom();

function allItemsForGame(gameKey){
  const sections = DATA[gameKey].sections.map(s => ({title:s.title, items:[...s.items]}));
  const customItems = custom[gameKey] || [];
  if(customItems.length){
    sections.push({title:"Adicionadas por você", items:customItems});
  }
  return sections;
}

function toggle(id){
  state[id] = !state[id];
  saveState(state);
  renderAll();
}

function toggleTip(btn){
  const box = btn.parentElement.nextElementSibling;
  box.classList.toggle("show");
  btn.textContent = box.classList.contains("show") ? "Ocultar dica" : "Mostrar dica";
}

function deleteCustom(gameKey, id){
  custom[gameKey] = (custom[gameKey]||[]).filter(i => i.id !== id);
  saveCustom(custom);
  delete state[id];
  saveState(state);
  renderAll();
}

function addCustom(gameKey){
  const nameInput = document.getElementById("add_name_"+gameKey);
  const descInput = document.getElementById("add_desc_"+gameKey);
  const tipInput = document.getElementById("add_tip_"+gameKey);
  const gsInput = document.getElementById("add_gs_"+gameKey);
  const name = nameInput.value.trim();
  if(!name) return;
  const id = "custom_"+gameKey+"_"+Date.now();
  custom[gameKey] = custom[gameKey] || [];
  custom[gameKey].push({
    id, name,
    gs: parseInt(gsInput.value)||0,
    desc: descInput.value.trim() || "—",
    tip: tipInput.value.trim() || "—"
  });
  saveCustom(custom);
  nameInput.value=""; descInput.value=""; tipInput.value=""; gsInput.value="";
  renderAll();
}

function resetAll(){
  if(confirm("Isso vai desmarcar TODAS as conquistas (o jogo base e as personalizadas não serão apagadas, só o progresso). Continuar?")){
    state = {};
    saveState(state);
    renderAll();
  }
}

// ===================== RENDER =====================
function computeProgress(gameKey){
  const sections = allItemsForGame(gameKey);
  let total=0, done=0;
  sections.forEach(s => s.items.forEach(i => {
    total++;
    if(state[i.id]) done++;
  }));
  return {total, done};
}

function renderOverview(){
  const ov = document.getElementById("overview");
  const p1 = computeProgress("ln1");
  const p2 = computeProgress("ln2");
  const totalAll = p1.total + p2.total;
  const doneAll = p1.done + p2.done;
  const pct = n => n.total ? Math.round(100*n.done/n.total) : 0;

  ov.innerHTML = `
    <div class="card">
      <h3>Geral (LN I + LN II) <span class="pct">${pct({total:totalAll,done:doneAll})}%</span></h3>
      <div class="bar"><div style="width:${pct({total:totalAll,done:doneAll})}%"></div></div>
      <small>${doneAll} de ${totalAll} conquistas obtidas</small>
    </div>
    <div class="card">
      <h3>Little Nightmares I <span class="pct">${pct(p1)}%</span></h3>
      <div class="bar"><div style="width:${pct(p1)}%"></div></div>
      <small>${p1.done} de ${p1.total} conquistas</small>
    </div>
    <div class="card">
      <h3>Little Nightmares II <span class="pct">${pct(p2)}%</span></h3>
      <div class="bar"><div style="width:${pct(p2)}%"></div></div>
      <small>${p2.done} de ${p2.total} conquistas</small>
    </div>
  `;
}

function renderGame(gameKey){
  const sections = allItemsForGame(gameKey);
  let html = "";
  sections.forEach(section => {
    const total = section.items.length;
    const done = section.items.filter(i => state[i.id]).length;
    html += `<div class="section">
      <div class="section-head">
        <h2>${section.title}</h2>
        <span class="count">${done}/${total}</span>
      </div>`;
    section.items.forEach(item => {
      const isDone = !!state[item.id];
      const isCustom = item.id.startsWith("custom_");
      html += `
        <div class="ach ${isDone?'done':''}">
          <div class="ach-top">
            <div class="chk" onclick="toggle('${item.id}')">${isDone?'✓':''}</div>
            <div class="ach-body">
              <div class="ach-name">${item.name}${item.gs?`<span class="gs">${item.gs}G</span>`:''}</div>
              <div class="ach-desc">"${item.desc}"</div>
              <div class="ach-actions">
                <button class="tip-btn" onclick="toggleTip(this)">Mostrar dica</button>
                ${isCustom?`<button class="del-btn" onclick="deleteCustom('${gameKey}','${item.id}')">Remover</button>`:''}
              </div>
              <div class="tip-box">${item.tip}</div>
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  html += `
    <button class="add-toggle" onclick="document.getElementById('addform_${gameKey}').style.display = document.getElementById('addform_${gameKey}').style.display==='block'?'none':'block'">+ Adicionar conquista manualmente</button>
    <div class="add-form" id="addform_${gameKey}" style="display:none">
      <input id="add_name_${gameKey}" placeholder="Nome da conquista">
      <input id="add_gs_${gameKey}" placeholder="Gamerscore (ex: 20)" type="number">
      <textarea id="add_desc_${gameKey}" placeholder="Descrição oficial" rows="2"></textarea>
      <textarea id="add_tip_${gameKey}" placeholder="Dica de como conseguir" rows="2"></textarea>
      <button onclick="addCustom('${gameKey}')">Salvar conquista</button>
    </div>
  `;

  return html;
}

function renderAll(){
  renderOverview();
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="game-block ${activeGame==='ln1'?'active':''}" id="block_ln1">${renderGame('ln1')}</div>
    <div class="game-block ${activeGame==='ln2'?'active':''}" id="block_ln2">${renderGame('ln2')}</div>
  `;
}

let activeGame = "ln1";
document.getElementById("tabs").addEventListener("click", e => {
  if(e.target.classList.contains("tab-btn")){
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    e.target.classList.add("active");
    activeGame = e.target.dataset.game;
    document.querySelectorAll(".game-block").forEach(b=>b.classList.remove("active"));
    document.getElementById("block_"+activeGame).classList.add("active");
  }
});

renderAll();
</script>
</body>
</html>
